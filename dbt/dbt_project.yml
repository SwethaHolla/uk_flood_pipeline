name: uk_flood
version: 1.0.0
config-version: 2

profile: uk_flood

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  uk_flood:
    +materialized: view
    staging:
      +schema: staging
      +tags: ["staging"]
    core:
      +schema: core
      +tags: ["core"]
    marts:
      +schema: marts
      +tags: ["marts"]
  # Elementary targets BigQuery only (its anomaly models use warehouse
  # functions DuckDB lacks); local duckdb builds skip it entirely.
  elementary:
    +enabled: "{{ target.type == 'bigquery' }}"

vars:
  # How far back the reliability mart looks
  reliability_window_days: 7
  trend_window_days: 28
