[project]
name = "uk-flood-pipeline"
version = "0.1.0"
description = "Resilient, observable batch ELT pipeline over the UK Environment Agency Flood Monitoring API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[bigquery,duckdb]>=1.31.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_flood", "mock_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require real BigQuery credentials (deselect with '-m \"not integration\"')",
]
filterwarnings = ["ignore::DeprecationWarning:dlt.*"]

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "dbt-bigquery>=1.8,<1.10",
    "dbt-core>=1.9,<1.10",
    "dbt-duckdb>=1.8,<1.10",
    "elementary-data[bigquery]>=0.13",
    "pre-commit>=3",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "sqlfluff>=3",
    "sqlfluff-templater-dbt>=3",
]
