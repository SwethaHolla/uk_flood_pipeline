# Offline profile for sqlfluff's dbt templater and `dbt parse` in CI.
# The templater must connect to build its relation cache, so we point it at a
# throwaway local DuckDB (no network, no credentials) instead of BigQuery.
uk_flood:
  target: ci
  outputs:
    ci:
      type: duckdb
      schema: main
      path: ":memory:"
      threads: 2
